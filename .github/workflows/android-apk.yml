name: Compiler PocketFTP APK
on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: SDK Android 35
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Tests et APK debug
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Télécharger l'APK depuis Actions
        uses: actions/upload-artifact@v4
        with:
          name: PocketFTP-0.2-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
